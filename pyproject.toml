[project]
name = "phinish"
version = "0.1.0"
description = "ML-powered Phish setlist predictions running entirely from a GitHub repository"
readme = "README.md"
requires-python = ">=3.12"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26"
scipy = ">=1.12"
scikit-learn = ">=1.4"
xgboost = ">=2.0"
httpx = ">=0.27"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check ."
fmt = "ruff format ."
test = "pytest"
check = { depends-on = ["lint", "test"] }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-v"
