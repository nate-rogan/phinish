[project]
name = "phinish"
version = "0.1.0"
description = "ML-powered Phish setlist predictions running entirely from a GitHub repository"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
phinish-scrape = "phinish.scrape:cli"
phinish-build-features = "phinish.build_features:main"
phinish-train-baseline = "phinish.train_baseline:main"
phinish-train-markov = "phinish.train_markov:main"
phinish-train-xgboost = "phinish.train_xgboost:main"
phinish-train-ensemble = "phinish.train_ensemble:main"
phinish-evaluate = "phinish.evaluate:main"
phinish-predict = "phinish.predict:cli"
phinish-process-issue = "phinish.process_issue:main"
phinish-process-year = "phinish.process_year:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phinish"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26"
scipy = ">=1.12"
scikit-learn = ">=1.4"
xgboost = ">=2.0"
httpx = ">=0.27"
stamina = ">=24.3"

[tool.pixi.pypi-dependencies]
phinish = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = "ruff check ."
fmt = "ruff format ."
test = "pytest"
check = { depends-on = ["lint", "test"] }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D100",  # missing module docstring (we require for scripts/, but allow elsewhere)
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests are self-documenting via test names
"src/phinish/__init__.py" = ["D"]
"src/phinish/*.py" = ["D102", "D105", "D106"]  # methods/dunders/nested classes optional

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-v"
