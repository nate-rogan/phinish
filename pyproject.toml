[project]
name = "phinish"
version = "0.1.0"
description = "ML-powered Phish setlist predictions running entirely from a GitHub repository"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
phinish-scrape = "phinish.scrape:cli"
phinish-build-features = "phinish.features.build:main"
phinish-train-baseline = "phinish.train.baseline:main"
phinish-train-markov = "phinish.train.markov:main"
phinish-train-xgboost = "phinish.train.xgboost:main"
phinish-train-ensemble = "phinish.train.ensemble:main"
phinish-evaluate = "phinish.evaluate.backtest:main"
phinish-predict = "phinish.predict:cli"
phinish-summarize = "phinish.predict.pipeline:summarize_cli"
phinish-process-issue = "phinish.process.issue:process_issue"
phinish-process-year = "phinish.process.year:process_year"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phinish"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26"
scipy = ">=1.12"
scikit-learn = ">=1.4"
xgboost = ">=2.0"
httpx = ">=0.27"
stamina = ">=24.3"
python-dotenv = ">=1.0"
msgspec = ">=0.18"
structlog = ">=25.0"

[tool.pixi.pypi-dependencies]
phinish = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
# --- Quality ---
lint = "ruff check ."
fmt = "ruff format ."
test = "pytest"
check = { depends-on = ["lint", "test"] }

# --- Pipeline stages (each maps to the matching [project.scripts] entry) ---
scrape = "phinish-scrape"                  # full pull; pass --year YYYY for incremental
features = "phinish-build-features"
train-baseline = "phinish-train-baseline"
train-markov = "phinish-train-markov"
train-xgboost = "phinish-train-xgboost"
train-ensemble = "phinish-train-ensemble"
evaluate = "phinish-evaluate"
predict = "phinish-predict"                # pass --date YYYY-MM-DD --venue "..."
summarize = "phinish-summarize"            # predict + LLM summary; pass --date, --venue, --voice

# --- Composed pipelines ---
train = { depends-on = ["train-baseline", "train-markov", "train-xgboost", "train-ensemble"] }
bootstrap = { depends-on = ["scrape", "features", "train", "evaluate"] }
retrain = { depends-on = ["features", "train", "evaluate"] }   # uses existing setlists.json

# --- GitHub Actions wrappers (run the same entry the workflows run) ---
process-year = "phinish-process-year"      # ISSUE_NUMBER, ISSUE_BODY, GITHUB_TOKEN, GITHUB_REPOSITORY env
process-issue = "phinish-process-issue"    # adds ISSUE_AUTHOR env

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D100",  # missing module docstring (we require for scripts/, but allow elsewhere)
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests are self-documenting via test names
"src/phinish/**/__init__.py" = ["D"]  # init files are pure re-exports
"src/phinish/**/*.py" = ["D102", "D105", "D106"]  # methods/dunders/nested classes optional

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-v"
