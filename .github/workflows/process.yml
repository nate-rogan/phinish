name: Process Year
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'process'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Restore data cache
        # Raw data is .gitignored per ToS but cached across runs so an
        # incremental retrain only re-fetches the requested year (the scrape
        # script merges by show_id into the existing setlists.json).
        # Cache key rotates daily — forces at least one full refresh per day.
        uses: actions/cache@v4
        with:
          path: |
            data/processed
            state/features
          key: phishnet-data-${{ format('{0:yyyy-MM-dd}', github.event.repository.updated_at) }}
          restore-keys: |
            phishnet-data-
      - name: Process year and retrain
        run: pixi run python -m phinish.process_year
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}
      - name: Commit model + feature artifacts
        # Raw setlists (data/processed/) are .gitignored per Phish.net API ToS.
        # Aggregate features and the trained model state snapshot are committed —
        # those are derivative aggregates, same posture as the model files.
        run: |
          git config user.name "phinish[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add models/ state/features/
          git diff --staged --quiet || git commit -m "retrain from issue #${{ github.event.issue.number }}"
          git push
      - name: Update labels and close
        if: success()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "process" --add-label "processed"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark failure
        if: failure()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "process" --add-label "failed"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
