name: Process Year
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'wf:process'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Process year and retrain
        run: pixi run process-year
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}
      - name: Commit model + feature artifacts
        # setlists.json is committed so incremental retrains accumulate.
        # songs.json and venues.json stay gitignored (large catalogs).
        run: |
          git config user.name "phinish[bot]"
          git config user.email "phinish[bot]@users.noreply.github.com"
          git add data/source/setlists.json data/state/ data/models/
          git diff --staged --quiet || git commit -m "retrain from issue #${{ github.event.issue.number }}"
          git push
      - name: Update labels and close
        if: success()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "wf:process" --add-label "wf:done:retrain"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark failure
        if: failure()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "wf:process" --add-label "wf:failed"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
