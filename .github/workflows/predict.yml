name: Predict Setlist
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: predict-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'predict'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Run prediction
        run: pixi run python -m scripts.process_issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit state
        run: |
          git config user.name "phinish[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add state/ reasons.md
          git diff --staged --quiet || git commit -m "prediction #${{ github.event.issue.number }}"
          git push
      - name: Update labels and close
        if: success()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "predict" --add-label "predicted"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark failure
        if: failure()
        run: |
          gh issue edit ${{ github.event.issue.number }} --remove-label "predict" --add-label "failed"
          gh issue close ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
