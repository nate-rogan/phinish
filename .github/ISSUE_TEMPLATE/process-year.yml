name: 🔄 Retrain Models
description: Re-scrape Phish.net and retrain all models. Idempotent — safe to repeat.
labels: ["wf:process"]
body:
  - type: markdown
    attributes:
      value: |
        Scrapes one year from Phish.net, merges it into the existing dataset,
        rebuilds features, retrains all models, and commits artifacts. ~3-5 min.

        Each year builds on the last — the bot's comment shows what changed.
  - type: input
    id: year
    attributes:
      label: Year
      description: |
        The year to add (e.g. `2001`). Merges into the existing dataset.
        Leave empty for a full scrape from 1983 to present.
      placeholder: "e.g. 2001"
    validations:
      required: false
