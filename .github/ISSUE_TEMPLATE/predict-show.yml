name: 🎸 Predict a Show
description: Get a setlist prediction for a Phish show
labels: ["wf:predict"]
body:
  - type: markdown
    attributes:
      value: |
        Submit this issue to trigger a prediction. The Action runs in ~30 seconds and posts the setlist as a comment.
  - type: input
    id: date
    attributes:
      label: Show Date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-12-31"
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Venue name (fuzzy-matched against the venue catalog)
      placeholder: "Madison Square Garden"
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City
      description: "Optional. e.g. New York, NY"
      placeholder: "New York, NY"
    validations:
      required: false
